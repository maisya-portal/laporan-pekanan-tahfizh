<!DOCTYPE html>
<html lang="id" prefix="og: http://ogp.me/ns#">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Laporan Pekanan Halaqoh – Maisya Tahfizh</title>

  <!-- ============================================== -->
  <!-- 1. GANTI URL INI DENGAN URL DEPLOY APLIKASI ANDA -->
  <!-- ============================================== -->
  <script>
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbwPZkQqo4xjGAgxk6LBcZegJbunxZ8eDKUDy9UaLAarZYYUyALV9y9XGovNrrcsLbO_hA/exec";
  </script>

  <!-- Open Graph (Bisa disesuaikan manual) -->
  <meta property="og:type"        content="website">
  <meta property="og:title"       content="Laporan Pekanan Halaqoh – Maisya Tahfizh">
  <meta property="og:description" content="Rekap setoran ziyadah, muroja'ah & tilawah santri halaqoh Maisya Tahfizh, Ponpes Imam Syafi'i Brebes.">
  <meta property="og:image"       content="https://lh3.googleusercontent.com/d/1nliMGEQLPyzVh_EDtcVjVlkQOMafMDwM">
  <meta property="og:image:width"  content="1200">
  <meta property="og:image:height" content="630">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.80rem; background: #fff; padding: 16px; color: #212529; }
    .print-header { text-align: center; margin-bottom: 20px; }
    .print-header h4 { color: #198754; font-weight: 700; margin: 0; }
    .print-header p  { color: #6c757d; margin: 2px 0 0; font-size: 0.82rem; }
    .periode-badge { display: inline-block; background: #e8f5e9; color: #198754; border-radius: 20px; padding: 4px 14px; font-size: 0.78rem; font-weight: 600; margin-top: 8px; }
    table { font-size: 0.72rem; }
    table th, table td { vertical-align: middle; }
    .no-print-bar { background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 10px 16px; display: flex; align-items: center; gap: 10px; margin: -16px -16px 20px; position: sticky; top: 0; z-index: 100; }
    @media print {
      .no-print-bar, .no-print { display: none !important; }
      body { padding: 0; margin: 0; }
      .sticky-col-1, .sticky-col-2, .sticky-col-3 { position: static !important; }
      table { font-size: 0.65rem !important; }
      th, td { padding: 3px 4px !important; }
      th { background-color: #212529 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-success { background-color: #198754 !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-primary { background-color: #0d6efd !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-info    { background-color: #0dcaf0 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-warning { background-color: #ffc107 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .table-light { background-color: #f8f9fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .table-warning { background-color: #fff3cd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-secondary { background-color: #6c757d !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    }
  </style>
</head>
<body>

  <!-- Toolbar -->
  <div class="no-print-bar">
    <img src="https://lh3.googleusercontent.com/d/1nliMGEQLPyzVh_EDtcVjVlkQOMafMDwM" alt="Logo" style="height:28px;">
    <span class="fw-bold text-success">Maisya Tahfizh</span>
    <span class="text-muted small">Laporan Pekanan Halaqoh</span>
    <div class="ms-auto d-flex gap-2">
      <button onclick="window.print()" class="btn btn-success btn-sm" id="btnCetak" disabled><i class="bi bi-printer me-1"></i>Cetak PDF</button>
    </div>
  </div>

  <div class="print-header">
    <h4><i class="bi bi-bar-chart-line me-2"></i>Laporan Pekanan Halaqoh</h4>
    <p>Ponpes Imam Syafi'i Brebes — Maisya Tahfizh</p>
    <div class="periode-badge" id="label-periode">Memuat Data...</div>
  </div>

  <div id="output">
    <div class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
      <div class="mt-3 text-muted fw-semibold">Mengambil data dari Server Maisya...</div>
      <div class="small text-muted mt-1">Harap tunggu sebentar</div>
    </div>
  </div>

  <script>
    // 2. AMBIL PARAMETER DARI URL GITHUB PAGES (Misal: ?start=2026-07-27&end=...&halaqoh=...)
    const urlParams = new URLSearchParams(window.location.search);
    const START_DATE = urlParams.get('start') || '';
    const END_DATE   = urlParams.get('end')   || '';
    const HALAQOH_ID = urlParams.get('halaqoh') || 'all';

    function fmtTgl(s) {
      if (!s) return '';
      var p = s.split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s;
    }

    if (START_DATE && END_DATE) {
      document.getElementById('label-periode').textContent = 'Periode: ' + fmtTgl(START_DATE) + ' s/d ' + fmtTgl(END_DATE);
    } else {
      document.getElementById('label-periode').textContent = 'Parameter Tanggal Tidak Valid';
      document.getElementById('output').innerHTML = '<div class="alert alert-warning text-center">URL tidak lengkap. Pastikan membuka link yang dibagikan dari aplikasi.</div>';
    }

    function renderLaporan(halaqohDataArr, catatanCache) {
      var output = document.getElementById('output');
      if (!halaqohDataArr || halaqohDataArr.length === 0) {
        output.innerHTML = '<div class="alert alert-info text-center"><i class="bi bi-info-circle me-2"></i>Tidak ada data halaqoh untuk rentang tanggal ini.</div>';
        return;
      }

      var jenisArr = ['ziyadah', 'iadah', 'tilawah', 'murojaah'];
      var dates = [];
      var cur  = new Date(START_DATE + 'T00:00:00');
      var endD = new Date(END_DATE   + 'T00:00:00');
      while (cur <= endD) {
        var y  = cur.getFullYear();
        var m  = String(cur.getMonth() + 1).padStart(2, '0');
        var d2 = String(cur.getDate()).padStart(2, '0');
        dates.push(y + '-' + m + '-' + d2);
        cur.setDate(cur.getDate() + 1);
      }
      var dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      var typeLabels = {
        'ziyadah' : { label: 'Ziy', bg: 'bg-success',           text: 'text-success' },
        'iadah'   : { label: 'Iad', bg: 'bg-info text-dark',    text: 'text-info'    },
        'tilawah' : { label: 'Til', bg: 'bg-warning text-dark', text: 'text-warning' },
        'murojaah': { label: 'Mur', bg: 'bg-primary',           text: 'text-primary' }
      };
      var colSpan = jenisArr.length;
      var html = '';

      halaqohDataArr.forEach(function(halaqoh, hidx) {
        var totals = {};
        jenisArr.forEach(function(j) { totals[j] = 0; });

        halaqoh.santri.forEach(function(s) {
          dates.forEach(function(d) {
            jenisArr.forEach(function(j) {
              var arr = (j === 'murojaah') ? (s.murojaah[d] || []) : (s.ziyadah[d] || []).filter(function(i) { return i.type === j; });
              totals[j] += arr.reduce(function(a, v) { return a + v.val; }, 0);
            });
          });
        });

        html += '<div class="mb-5">';
        html += '<div class="d-flex align-items-center gap-3 mb-3">';
        html += '<div class="rounded-circle bg-success d-flex align-items-center justify-content-center text-white fw-bold fs-5" style="width:44px;height:44px;flex-shrink:0;">' + (halaqoh.namaHalaqoh || '?').charAt(0) + '</div>';
        html += '<div><h6 class="fw-bold text-success mb-0">' + (halaqoh.namaHalaqoh || '-') + '</h6>';
        html += '<div class="text-muted small">Pengampu: <strong>' + (halaqoh.ustadzNama || '-') + '</strong></div></div></div>';

        html += '<div class="table-responsive" style="font-size:0.75rem;">';
        html += '<table class="table table-bordered align-middle mb-0">';
        html += '<thead>';
        html += '<tr class="table-dark text-white">';
        html += '<th rowspan="2" class="text-center align-middle text-white" style="min-width:30px;background:#212529;">No</th>';
        html += '<th rowspan="2" class="text-center align-middle text-white" style="min-width:150px;background:#212529;">Nama</th>';
        html += '<th rowspan="2" class="text-center align-middle text-white" style="min-width:50px;background:#212529;">Kls</th>';

        dates.forEach(function(d) {
          var dayIdx  = new Date(d + 'T00:00:00').getDay();
          var dayNum  = parseInt(d.slice(8, 10));
          var monthNum= parseInt(d.slice(5, 7));
          var isFri   = dayIdx === 5;
          html += '<th colspan="' + colSpan + '" class="text-center ' + (isFri ? 'table-warning' : '') + '" style="min-width:' + (colSpan * 65) + 'px;">';
          html += '<div class="fw-bold">' + dayNum + '/' + monthNum + '</div>';
          html += '<div style="font-size:0.65rem;opacity:0.8;">' + dayNames[dayIdx] + '</div></th>';
        });

        jenisArr.forEach(function(j) {
          html += '<th rowspan="2" class="text-center align-middle ' + typeLabels[j].bg + '" style="min-width:50px;">Tot<br><small>' + typeLabels[j].label + '</small></th>';
        });
        html += '<th rowspan="2" class="text-center align-middle text-white bg-secondary" style="min-width:180px;">Catatan &amp; Evaluasi</th>';

        html += '</tr><tr class="table-secondary">';
        dates.forEach(function(d) {
          jenisArr.forEach(function(j) {
            html += '<th class="text-center ' + typeLabels[j].text + ' fw-bold" style="font-size:0.63rem;padding:3px;">' + typeLabels[j].label.toUpperCase() + '</th>';
          });
        });
        html += '</tr></thead><tbody>';

        halaqoh.santri.forEach(function(s, sidx) {
          var santriTotals = {};
          jenisArr.forEach(function(j) { santriTotals[j] = 0; });

          html += '<tr>';
          html += '<td class="text-center text-muted" style="font-size:0.7rem;">' + (sidx + 1) + '</td>';
          html += '<td><div class="fw-semibold">' + (s.nama || '-') + '</div><div class="text-muted" style="font-size:0.63rem;">NIS: ' + s.nis + '</div></td>';
          html += '<td class="text-center">' + (s.kelas || '-') + '</td>';

          dates.forEach(function(d) {
            jenisArr.forEach(function(j) {
              var arr = (j === 'murojaah') ? (s.murojaah[d] || []) : (s.ziyadah[d] || []).filter(function(i) { return i.type === j; });
              var sum = arr.reduce(function(a, v) { return a + v.val; }, 0);
              santriTotals[j] += sum;
              var infoJoin = arr.map(function(item) { return item.info; }).join(', ');
              html += '<td class="text-center p-1" style="vertical-align:top;">';
              if (arr.length > 0) {
                html += '<span class="badge ' + typeLabels[j].bg + ' rounded-pill mb-1">' + sum + '</span>';
                html += '<div class="' + typeLabels[j].text + '" style="font-size:0.60rem;white-space:pre-wrap;word-break:break-word;line-height:1.1;">' + infoJoin + '</div>';
              } else {
                html += '<span style="color:#ccc;font-size:0.7rem;">-</span>';
              }
              html += '</td>';
            });
          });

          jenisArr.forEach(function(j) {
            html += '<td class="text-center fw-bold ' + (santriTotals[j] > 0 ? typeLabels[j].text : 'text-muted') + '">' + santriTotals[j] + '</td>';
          });

          // Catatan pekanan
          var santriCatatan = '';
          if (catatanCache) {
            var f = catatanCache.filter(function(c) { return String(c.NIS) === String(s.nis); });
            if (f.length > 0) santriCatatan = f[0].Catatan || '';
          }
          var dispCatatan = santriCatatan || '<span class="text-muted fst-italic">-</span>';
          html += '<td class="text-start bg-light align-middle" style="min-width:180px;">';
          html += '<div style="font-size:0.73rem;white-space:pre-wrap;word-break:break-word;padding:4px;">' + dispCatatan + '</div>';
          html += '</td>';
          html += '</tr>';
        });

        // Total row
        html += '<tr class="table-light fw-bold"><td></td><td class="text-muted small"></td><td class="text-end text-muted small">Total:</td>';
        dates.forEach(function(d) {
          jenisArr.forEach(function(j) {
            var daySum = 0;
            halaqoh.santri.forEach(function(s) {
              var arr = (j === 'murojaah') ? (s.murojaah[d] || []) : (s.ziyadah[d] || []).filter(function(i) { return i.type === j; });
              daySum += arr.reduce(function(a, v) { return a + v.val; }, 0);
            });
            html += '<td class="text-center ' + typeLabels[j].text + '">' + (daySum || '-') + '</td>';
          });
        });
        jenisArr.forEach(function(j) {
          html += '<td class="text-center ' + typeLabels[j].text + '">' + totals[j] + '</td>';
        });
        html += '<td class="bg-light"></td>';
        html += '</tr></tbody></table></div></div>';

        if (hidx < halaqohDataArr.length - 1) html += '<hr class="my-4">';
      });

      output.innerHTML = html;
      document.getElementById('btnCetak').disabled = false;
    }

    // 3. FETCH DATA DARI GOOGLE APPS SCRIPT (Menggunakan JSONP untuk Bypass CORS)
    if (START_DATE && END_DATE) {
      // Buat nama fungsi callback global
      window.handleLaporanData = function(res) {
        if (!res || !res.success) {
          document.getElementById('output').innerHTML = 
            '<div class="alert alert-danger text-center">Gagal memuat laporan: ' + (res ? (res.message || 'Server error.') : 'Respons kosong.') + '</div>';
          return;
        }
        renderLaporan(res.data, res.catatan);
      };

      // Tambahkan script tag secara dinamis untuk trigger request JSONP
      const apiUrl = `${GAS_WEBAPP_URL}?api=laporan&start=${START_DATE}&end=${END_DATE}&halaqoh=${HALAQOH_ID}&callback=handleLaporanData`;
      const script = document.createElement('script');
      script.src = apiUrl;
      script.onerror = function() {
        document.getElementById('output').innerHTML = 
          '<div class="alert alert-danger text-center">Terjadi kesalahan saat menghubungi server (CORS / Network Error).</div>';
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
