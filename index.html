  <style>
    body { font-family: 'Segoe UI', Arial, sans-serif; font-size: 0.80rem; background: #fff; padding: 16px; color: #212529; }
    .print-header { text-align: center; margin-bottom: 20px; }
    .print-header h4 { color: #198754; font-weight: 700; margin: 0; }
    .print-header p  { color: #6c757d; margin: 2px 0 0; font-size: 0.82rem; }
    .periode-badge { display: inline-block; background: #e8f5e9; color: #198754; border-radius: 20px; padding: 4px 14px; font-size: 0.78rem; font-weight: 600; margin-top: 8px; }
    table { font-size: 0.72rem; }
    table th, table td { vertical-align: middle; }
    .no-print-bar { background: #f8f9fa; border-bottom: 1px solid #dee2e6; padding: 10px 16px; display: flex; align-items: center; gap: 10px; margin: -16px -16px 20px; position: sticky; top: 0; z-index: 100; }

      .bg-info    { background-color: #0dcaf0 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-warning { background-color: #ffc107 !important; color: #000 !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .table-light { background-color: #f8f9fa !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .table-warning { background-color: #fff3cd !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
      .bg-secondary { background-color: #6c757d !important; color: #fff !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }

<body>

  <!-- Toolbar -->
  <div class="no-print-bar">
    <img src="https://lh3.googleusercontent.com/d/1nliMGEQLPyzVh_EDtcVjVlkQOMafMDwM" alt="Logo" style="height:28px;">
    <span class="fw-bold text-success">Maisya Tahfizh</span>
    <span class="text-muted small" id="toolbar-sub-title">Laporan Pekanan</span>
    <div class="ms-auto d-flex gap-2" id="toolbar-action-buttons">
      <button onclick="window.print()" class="btn btn-success btn-sm" id="btnCetak" disabled><i class="bi bi-printer me-1"></i>Cetak PDF</button>
    </div>
  </div>

  <div class="print-header" id="header-area">
    <h4 id="doc-main-title"><i class="bi bi-bar-chart-line me-2"></i>Laporan Pekanan Halaqoh</h4>
    <p>Ponpes Imam Syafi'i Brebes — Maisya Tahfizh</p>
    <div class="periode-badge" id="label-periode">Memuat Data...</div>
  </div>

  <div id="output">
    <div class="text-center py-5">
      <div class="spinner-border text-success" role="status"></div>
      <div class="mt-3 text-muted fw-semibold">Mengambil data dari Server Maisya...</div>
      <div class="small text-muted mt-1">Harap tunggu sebentar</div>
    </div>
  </div>

  <script>
    // Parameter URL GitHub Pages
    const urlParams = new URLSearchParams(window.location.search);
    const START_DATE = urlParams.get('start') || '';
    const END_DATE   = urlParams.get('end')   || '';
    const HALAQOH_ID = urlParams.get('halaqoh') || 'all';
    var NIS_PARAM    = urlParams.get('nis') || '';

    window._rawHalaqohData = [];
    window._rawCatatanData = [];

    function fmtTgl(s) {
      if (!s) return '';
      var p = s.split('-');
      return p.length === 3 ? p[2] + '/' + p[1] + '/' + p[0] : s;
    }

    function fmtDateIndo(dStr) {
      if (!dStr) return '';
      var p = dStr.split('-');
      if (p.length !== 3) return dStr;
      var months = ['', 'Januari', 'Februari', 'Maret', 'April', 'Mei', 'Juni', 'Juli', 'Agustus', 'September', 'Oktober', 'November', 'Desember'];
      return parseInt(p[2], 10) + ' ' + (months[parseInt(p[1], 10)] || p[1]) + ' ' + p[0];
    }

    if (START_DATE && END_DATE) {
      document.getElementById('label-periode').textContent = 'Periode: ' + fmtTgl(START_DATE) + ' s/d ' + fmtTgl(END_DATE);
    } else {
      document.getElementById('label-periode').textContent = 'Parameter Tanggal Tidak Valid';
      document.getElementById('output').innerHTML = '<div class="alert alert-warning text-center">URL tidak lengkap. Pastikan membuka link yang dibagikan dari aplikasi.</div>';
    }

    // ==========================================
    // 1. RENDER LAPORAN SANTRI (POTRAIT VIEW)
    // ==========================================
    function renderLaporanSantri(halaqohDataArr, catatanCache, targetNis) {
      var output = document.getElementById('output');
      var foundSantri = null;
      var foundHalaqoh = null;

      for (var h = 0; h < halaqohDataArr.length; h++) {
        var hObj = halaqohDataArr[h];
        for (var s = 0; s < (hObj.santri || []).length; s++) {
          if (String(hObj.santri[s].nis) === String(targetNis)) {
            foundSantri = hObj.santri[s];
            foundHalaqoh = hObj;
            break;
          }
        }
        if (foundSantri) break;
      }

      if (!foundSantri) {
        output.innerHTML = '<div class="alert alert-warning text-center"><i class="bi bi-exclamation-triangle me-2"></i>Data santri dengan NIS ' + targetNis + ' tidak ditemukan pada periode ini.<br><button class="btn btn-outline-success btn-sm mt-3" onclick="switchToHalaqohView()"><i class="bi bi-arrow-left me-1"></i>Kembali ke Laporan Halaqoh</button></div>';
        return;
      }

      // Update Header & Judul
      document.getElementById('doc-main-title').innerHTML = '<i class="bi bi-person-badge me-2"></i>Laporan Pekanan Santri (Potrait)';
      document.getElementById('toolbar-sub-title').textContent = 'Detail Potrait - ' + (foundSantri.nama || '-');

      // Update Toolbar Buttons
      var toolbarBtn = document.getElementById('toolbar-action-buttons');
      toolbarBtn.innerHTML = '<button onclick="switchToHalaqohView()" class="btn btn-outline-secondary btn-sm me-1"><i class="bi bi-grid-3x3 me-1"></i>Rekap Halaqoh</button><button onclick="window.print()" class="btn btn-success btn-sm"><i class="bi bi-printer me-1"></i>Cetak Potrait / PDF</button>';

      var dates = [];
      var cur = new Date(START_DATE + 'T00:00:00');
      var endD = new Date(END_DATE + 'T00:00:00');
      while (cur <= endD) {
        if (cur.getDay() !== 0) { // Lewati hari libur Ahad
          var y = cur.getFullYear();
          var m = String(cur.getMonth() + 1).padStart(2, '0');
          var d2 = String(cur.getDate()).padStart(2, '0');
          dates.push(y + '-' + m + '-' + d2);
        }
        cur.setDate(cur.getDate() + 1);
      }
      var dayNamesIndo = ['Ahad', 'Senin', 'Selasa', 'Rabu', 'Kamis', 'Jum\'at', 'Sabtu'];

      // Catatan santri
      var santriCatatan = '';
      if (catatanCache) {
        var f = catatanCache.filter(function(c) { return String(c.NIS) === String(foundSantri.nis); });
        if (f.length > 0) santriCatatan = f[0].Catatan || '';
      }

      var jenisArr = ['ziyadah', 'iadah', 'tilawah', 'murojaah'];
      var totals = { ziyadah: 0, iadah: 0, tilawah: 0, murojaah: 0 };
      var absensiTotals = { Hadir: 0, Izin: 0, Sakit: 0, Alpa: 0 };

      dates.forEach(function(d) {
        jenisArr.forEach(function(j) {
          var arr = (j === 'murojaah') ? (foundSantri.murojaah[d] || []) : (foundSantri.ziyadah[d] || []).filter(function(i) { return i.type === j; });
          var sum = arr.reduce(function(a, v) { return a + v.val; }, 0);
          totals[j] = (totals[j] || 0) + sum;
        });

        var absArr = (foundSantri.absensi && foundSantri.absensi[d]) ? foundSantri.absensi[d] : [];
        absArr.forEach(function(item) {
          var st = (item.status || 'Hadir').trim().toLowerCase();
          if (st.indexOf('hadir') !== -1) absensiTotals.Hadir++;
          else if (st.indexOf('izin') !== -1) absensiTotals.Izin++;
          else if (st.indexOf('sakit') !== -1) absensiTotals.Sakit++;
          else if (st.indexOf('alpa') !== -1 || st.indexOf('tanpa') !== -1) absensiTotals.Alpa++;
        });
      });

      var html = '';
      html += '<div class="container-fluid px-0" style="max-width: 800px; margin: 0 auto;">';
      
      // Identitas Santri
      html += '  <div class="card border mb-3 shadow-none">';
      html += '    <div class="card-body p-3">';
      html += '      <div class="d-flex justify-content-between align-items-start">';
      html += '        <div>';
      html += '          <h5 class="fw-bold text-success mb-1">' + (foundSantri.nama || '-') + '</h5>';
      html += '          <div class="text-muted small d-flex flex-wrap gap-3">';
      html += '            <span><strong>NIS:</strong> ' + foundSantri.nis + '</span>';
      html += '            <span><strong>Kelas:</strong> ' + (foundSantri.kelas || '-') + '</span>';
      html += '            <span><strong>Halaqoh:</strong> ' + (foundHalaqoh.namaHalaqoh || '-') + '</span>';
      html += '            <span><strong>Pengampu:</strong> ' + (foundHalaqoh.ustadzNama || '-') + '</span>';
      html += '          </div>';
      html += '        </div>';
      html += '      </div>';
      html += '    </div>';
      html += '  </div>';

      // 4 Box Metrik Capaian Setoran
      html += '  <div class="row g-2 mb-2 text-center">';
      html += '    <div class="col-3"><div class="p-2 border rounded bg-light"><div class="text-success small fw-bold">Ziyadah</div><div class="fs-5 fw-bold text-success">' + (totals.ziyadah || 0) + ' <small class="text-muted" style="font-size:0.7rem;">sesi</small></div></div></div>';
      html += '    <div class="col-3"><div class="p-2 border rounded bg-light"><div class="text-info-emphasis small fw-bold">I\'adah</div><div class="fs-5 fw-bold text-info-emphasis">' + (totals.iadah || 0) + ' <small class="text-muted" style="font-size:0.7rem;">sesi</small></div></div></div>';
      html += '    <div class="col-3"><div class="p-2 border rounded bg-light"><div class="text-warning-emphasis small fw-bold">Tilawah</div><div class="fs-5 fw-bold text-warning-emphasis">' + (totals.tilawah || 0) + ' <small class="text-muted" style="font-size:0.7rem;">juz</small></div></div></div>';
      html += '    <div class="col-3"><div class="p-2 border rounded bg-light"><div class="text-primary small fw-bold">Muroja\'ah</div><div class="fs-5 fw-bold text-primary">' + (totals.murojaah || 0) + ' <small class="text-muted" style="font-size:0.7rem;">juz</small></div></div></div>';
      html += '  </div>';

      // Ringkasan Kehadiran Halaqoh
      html += '  <div class="p-2 px-3 rounded-3 border bg-light d-flex flex-wrap align-items-center justify-content-between gap-2 mb-3">';
      html += '    <div class="fw-semibold text-dark small"><i class="bi bi-calendar-check text-success me-2"></i>Rekap Absensi Halaqoh Pekan Ini:</div>';
      html += '    <div class="d-flex flex-wrap gap-2">';
      html += '      <span class="badge bg-success-subtle text-success border border-success-subtle px-2 py-1"><i class="bi bi-check-circle me-1"></i>Hadir: ' + absensiTotals.Hadir + '</span>';
      html += '      <span class="badge bg-info-subtle text-info-emphasis border border-info-subtle px-2 py-1"><i class="bi bi-info-circle me-1"></i>Izin: ' + absensiTotals.Izin + '</span>';
      html += '      <span class="badge bg-warning-subtle text-warning-emphasis border border-warning-subtle px-2 py-1"><i class="bi bi-exclamation-circle me-1"></i>Sakit: ' + absensiTotals.Sakit + '</span>';
      html += '      <span class="badge bg-danger-subtle text-danger border border-danger-subtle px-2 py-1"><i class="bi bi-x-circle me-1"></i>Alpa: ' + absensiTotals.Alpa + '</span>';
      html += '    </div>';
      html += '  </div>';

      // Tabel Runtut Hari Demi Hari (Potrait)
      html += '  <table class="table table-bordered table-striped align-middle mb-3" style="font-size:0.78rem;">';
      html += '    <thead class="table-dark text-white text-center">';
      html += '      <tr>';
      html += '        <th style="width: 120px;">Hari &amp; Tanggal</th>';
      html += '        <th style="width: 130px;">Absensi Halaqoh</th>';
      html += '        <th>Ziyadah</th>';
      html += '        <th>I\'adah</th>';
      html += '        <th>Tilawah</th>';
      html += '        <th>Muroja\'ah</th>';
      html += '      </tr>';
      html += '    </thead>';
      html += '    <tbody>';

      dates.forEach(function(d) {
        var dateObj = new Date(d + 'T00:00:00');
        var dayIdx = dateObj.getDay();
        var dayName = dayNamesIndo[dayIdx];
        var dayNum = parseInt(d.slice(8, 10), 10);
        var monthNum = parseInt(d.slice(5, 7), 10);
        var isFriday = (dayIdx === 5);

        html += '      <tr>';
        html += '        <td class="text-center ' + (isFriday ? 'table-warning fw-bold text-warning-emphasis' : 'fw-semibold text-dark') + '">';
        html += '          <div>' + dayName + '</div>';
        html += '          <div class="text-muted small" style="font-size:0.68rem;">' + dayNum + '/' + monthNum + '</div>';
        html += '        </td>';

        // Absensi
        var absArr = (foundSantri.absensi && foundSantri.absensi[d]) ? foundSantri.absensi[d] : [];
        html += '        <td class="text-center p-2" style="min-width:120px;">';
        if (absArr.length > 0) {
          absArr.forEach(function(item) {
            var st = (item.status || 'Hadir').trim();
            var stLower = st.toLowerCase();
            var badgeCls = 'bg-success text-white';
            if (stLower.indexOf('izin') !== -1) badgeCls = 'bg-info text-dark';
            else if (stLower.indexOf('sakit') !== -1) badgeCls = 'bg-warning text-dark';
            else if (stLower.indexOf('alpa') !== -1 || stLower.indexOf('tanpa') !== -1) badgeCls = 'bg-danger text-white';

            var sesiLabel = item.sesi ? ' (' + item.sesi + ')' : '';
            var ketLabel = item.ket ? '<div class="text-muted" style="font-size:0.65rem;">' + item.ket + '</div>' : '';
            html += '<div class="mb-1"><span class="badge ' + badgeCls + ' py-1 px-2">' + st + sesiLabel + '</span>' + ketLabel + '</div>';
          });
        } else {
          html += '<span class="text-muted small fst-italic">-</span>';
        }
        html += '        </td>';

        // Ziyadah
        var ziyArr = (foundSantri.ziyadah[d] || []).filter(function(i) { return i.type === 'ziyadah'; });
        html += '        <td class="text-start p-2">';
        if (ziyArr.length > 0) {
          ziyArr.forEach(function(item) {
            html += '<div class="mb-1"><span class="badge bg-success py-1 px-2">' + (item.info || 'Ziyadah') + '</span></div>';
          });
        } else {
          html += '<span class="text-muted small">-</span>';
        }
        html += '        </td>';

        // I'adah
        var iadArr = (foundSantri.ziyadah[d] || []).filter(function(i) { return i.type === 'iadah'; });
        html += '        <td class="text-start p-2">';
        if (iadArr.length > 0) {
          iadArr.forEach(function(item) {
            html += '<div class="mb-1"><span class="badge bg-info text-dark py-1 px-2">' + (item.info || 'I\'adah') + '</span></div>';
          });
        } else {
          html += '<span class="text-muted small">-</span>';
        }
        html += '        </td>';

        // Tilawah
        var tilArr = (foundSantri.ziyadah[d] || []).filter(function(i) { return i.type === 'tilawah'; });
        html += '        <td class="text-start p-2">';
        if (tilArr.length > 0) {
          tilArr.forEach(function(item) {
            html += '<div class="mb-1"><span class="badge bg-warning text-dark py-1 px-2">' + (item.info || 'Tilawah') + '</span></div>';
          });
        } else {
          html += '<span class="text-muted small">-</span>';
        }
        html += '        </td>';

        // Muroja'ah
        var murArr = foundSantri.murojaah[d] || [];
        html += '        <td class="text-start p-2">';
        if (murArr.length > 0) {
          murArr.forEach(function(item) {
            html += '<div class="mb-1"><span class="badge bg-primary py-1 px-2">' + (item.info || 'Muroja\'ah') + '</span></div>';
          });
        } else {
          html += '<span class="text-muted small">-</span>';
        }
        html += '        </td>';

        html += '      </tr>';
      });

      html += '    </tbody>';
      html += '  </table>';

      // Catatan Ustadz
      html += '  <div class="card border mb-4 shadow-none">';
      html += '    <div class="card-body p-3">';
      html += '      <h6 class="fw-bold text-dark mb-1"><i class="bi bi-chat-left-text me-2 text-success"></i>Catatan &amp; Evaluasi Pekanan Ustadz</h6>';
      html += '      <div class="text-secondary small mt-2" style="white-space: pre-wrap; line-height: 1.5;">' + (santriCatatan || '<span class="text-muted fst-italic">Tidak ada catatan khusus untuk santri ini.</span>') + '</div>';
      html += '    </div>';
      html += '  </div>';
      window._santriHalaqoh = foundHalaqoh;

      html += '</div>';
      output.innerHTML = html;
    }

    function switchToHalaqohView() {
      NIS_PARAM = '';
      if (window._santriHalaqoh) {
        renderLaporan([window._santriHalaqoh], window._rawCatatanData);
      } else {
        renderLaporan(window._rawHalaqohData, window._rawCatatanData);
      }
    }

    // ==========================================
    // 2. RENDER LAPORAN HALAQOH (MATRIX VIEW)
    // ==========================================
    function renderLaporan(halaqohDataArr, catatanCache) {
      window._rawHalaqohData = halaqohDataArr;
      window._rawCatatanData = catatanCache;

      // Jika ada parameter NIS spesifik, langsung render tampilan portrait
      if (NIS_PARAM && NIS_PARAM.trim() !== '') {
        renderLaporanSantri(halaqohDataArr, catatanCache, NIS_PARAM);
        return;
      }

      var output = document.getElementById('output');
      if (!halaqohDataArr || halaqohDataArr.length === 0) {
        output.innerHTML = '<div class="alert alert-info text-center"><i class="bi bi-info-circle me-2"></i>Tidak ada data halaqoh untuk rentang tanggal ini.</div>';
        return;
      }

      document.getElementById('doc-main-title').innerHTML = '<i class="bi bi-bar-chart-line me-2"></i>Laporan Pekanan Halaqoh';
      document.getElementById('toolbar-sub-title').textContent = 'Laporan Pekanan Halaqoh';
      document.getElementById('toolbar-action-buttons').innerHTML = '<button onclick="window.print()" class="btn btn-success btn-sm"><i class="bi bi-printer me-1"></i>Cetak / Simpan PDF</button>';

      var jenisArr = ['ziyadah', 'iadah', 'tilawah', 'murojaah'];
      var dates = [];
      var cur  = new Date(START_DATE + 'T00:00:00');
      var endD = new Date(END_DATE   + 'T00:00:00');
      while (cur <= endD) {
        if (cur.getDay() !== 0) { // Lewati hari libur Ahad
          var y  = cur.getFullYear();
          var m  = String(cur.getMonth() + 1).padStart(2, '0');
          var d2 = String(cur.getDate()).padStart(2, '0');
          dates.push(y + '-' + m + '-' + d2);
        }
        cur.setDate(cur.getDate() + 1);
      }
      var dayNames = ['Min', 'Sen', 'Sel', 'Rab', 'Kam', 'Jum', 'Sab'];
      var typeLabels = {
        'ziyadah' : { label: 'Ziy', bg: 'bg-success',           text: 'text-success' },
        'iadah'   : { label: 'Iad', bg: 'bg-info text-dark',    text: 'text-info'    },
        'tilawah' : { label: 'Til', bg: 'bg-warning text-dark', text: 'text-warning' },
        'murojaah': { label: 'Mur', bg: 'bg-primary',           text: 'text-primary' }
      };
      var colSpan = jenisArr.length;
      var html = '';

      halaqohDataArr.forEach(function(halaqoh, hidx) {
        var totals = {};
        jenisArr.forEach(function(j) { totals[j] = 0; });

        halaqoh.santri.forEach(function(s) {
          dates.forEach(function(d) {
            jenisArr.forEach(function(j) {
              var arr = (j === 'murojaah') ? (s.murojaah[d] || []) : (s.ziyadah[d] || []).filter(function(i) { return i.type === j; });
              totals[j] += arr.reduce(function(a, v) { return a + v.val; }, 0);
            });
          });
        });

        html += '<div class="mb-5">';
        html += '<div class="d-flex align-items-center gap-3 mb-3">';
        html += '<div class="rounded-circle bg-success d-flex align-items-center justify-content-center text-white fw-bold fs-5" style="width:44px;height:44px;flex-shrink:0;">' + (halaqoh.namaHalaqoh || '?').charAt(0) + '</div>';
        html += '<div><h6 class="fw-bold text-success mb-0">' + (halaqoh.namaHalaqoh || '-') + '</h6>';
        html += '<div class="text-muted small">Pengampu: <strong>' + (halaqoh.ustadzNama || '-') + '</strong></div></div></div>';

        html += '<div class="table-responsive" style="font-size:0.75rem;">';
        html += '<table class="table table-bordered align-middle mb-0">';
        html += '<thead>';
        html += '<tr class="table-dark text-white">';
        html += '<th rowspan="2" class="text-center align-middle text-white" style="min-width:30px;background:#212529;">No</th>';
        html += '<th rowspan="2" class="text-center align-middle text-white" style="min-width:150px;background:#212529;">Nama Santri</th>';
        html += '<th rowspan="2" class="text-center align-middle text-white" style="min-width:50px;background:#212529;">Kls</th>';

        dates.forEach(function(d) {
          var dayIdx  = new Date(d + 'T00:00:00').getDay();
          var dayNum  = parseInt(d.slice(8, 10));
          var monthNum= parseInt(d.slice(5, 7));
          var isFri   = dayIdx === 5;
          html += '<th colspan="' + colSpan + '" class="text-center ' + (isFri ? 'table-warning' : '') + '" style="min-width:' + (colSpan * 65) + 'px;">';
          html += '<div class="fw-bold">' + dayNum + '/' + monthNum + '</div>';
          html += '<div style="font-size:0.65rem;opacity:0.8;">' + dayNames[dayIdx] + '</div></th>';
        });

        jenisArr.forEach(function(j) {
          html += '<th rowspan="2" class="text-center align-middle ' + typeLabels[j].bg + '" style="min-width:50px;">Tot<br><small>' + typeLabels[j].label + '</small></th>';
        });
        html += '<th rowspan="2" class="text-center align-middle text-white bg-secondary" style="min-width:180px;">Catatan &amp; Evaluasi</th>';

        html += '</tr><tr class="table-secondary">';
        dates.forEach(function(d) {
          jenisArr.forEach(function(j) {
            html += '<th class="text-center ' + typeLabels[j].text + ' fw-bold" style="font-size:0.63rem;padding:3px;">' + typeLabels[j].label.toUpperCase() + '</th>';
          });
        });
        html += '</tr></thead><tbody>';

        halaqoh.santri.forEach(function(s, sidx) {
          var santriTotals = {};
          jenisArr.forEach(function(j) { santriTotals[j] = 0; });

          html += '<tr>';
          html += '<td class="text-center text-muted" style="font-size:0.7rem;">' + (sidx + 1) + '</td>';
          html += '<td>';
          html += '  <a href="javascript:void(0)" class="text-success fw-bold text-decoration-none" onclick="renderLaporanSantri(window._rawHalaqohData, window._rawCatatanData, \'' + s.nis + '\')" title="Klik untuk lihat rincian potrait santri ini">';
          html += '    <i class="bi bi-person-fill me-1"></i>' + (s.nama || '-');
          html += '  </a>';
          html += '  <div class="text-muted" style="font-size:0.63rem;">NIS: ' + s.nis + '</div>';
          html += '</td>';
          html += '<td class="text-center">' + (s.kelas || '-') + '</td>';

          dates.forEach(function(d) {
            jenisArr.forEach(function(j) {
              var arr = (j === 'murojaah') ? (s.murojaah[d] || []) : (s.ziyadah[d] || []).filter(function(i) { return i.type === j; });
              var sum = arr.reduce(function(a, v) { return a + v.val; }, 0);
              santriTotals[j] += sum;
              var infoJoin = arr.map(function(item) { return item.info; }).join(', ');
              html += '<td class="text-center p-1" style="vertical-align:top;">';
              if (arr.length > 0) {
                html += '<span class="badge ' + typeLabels[j].bg + ' rounded-pill mb-1">' + sum + '</span>';
                html += '<div class="' + typeLabels[j].text + '" style="font-size:0.60rem;white-space:pre-wrap;word-break:break-word;line-height:1.1;">' + infoJoin + '</div>';
              } else {
                html += '<span style="color:#ccc;font-size:0.7rem;">-</span>';
              }
              html += '</td>';
            });
          });

          jenisArr.forEach(function(j) {
            html += '<td class="text-center fw-bold ' + (santriTotals[j] > 0 ? typeLabels[j].text : 'text-muted') + '">' + santriTotals[j] + '</td>';
          });

          // Catatan pekanan
          var santriCatatan = '';
          if (catatanCache) {
            var f = catatanCache.filter(function(c) { return String(c.NIS) === String(s.nis); });
            if (f.length > 0) santriCatatan = f[0].Catatan || '';
          }
          var dispCatatan = santriCatatan || '<span class="text-muted fst-italic">-</span>';
          html += '<td class="text-start bg-light align-middle" style="min-width:180px;">';
          html += '<div style="font-size:0.73rem;white-space:pre-wrap;word-break:break-word;padding:4px;">' + dispCatatan + '</div>';
          html += '</td>';
          html += '</tr>';
        });

        // Total row
        html += '<tr class="table-light fw-bold"><td></td><td class="text-muted small"></td><td class="text-end text-muted small">Total:</td>';
        dates.forEach(function(d) {
          jenisArr.forEach(function(j) {
            var daySum = 0;
            halaqoh.santri.forEach(function(s) {
              var arr = [];
              if (j === 'murojaah') { arr = s.murojaah[d] || []; }
              else { arr = (s.ziyadah[d] || []).filter(function(i) { return i.type === j; }); }
              daySum += arr.reduce(function(a, v) { return a + v.val; }, 0);
            });
            html += '<td class="text-center ' + typeLabels[j].text + '">' + (daySum || '-') + '</td>';
          });
        });
        jenisArr.forEach(function(j) {
          html += '<td class="text-center ' + typeLabels[j].text + '">' + totals[j] + '</td>';
        });
        html += '<td class="bg-light"></td>';
        html += '</tr></tbody></table></div></div>';

        if (hidx < halaqohDataArr.length - 1) html += '<hr class="my-4">';
      });

      output.innerHTML = html;
      document.getElementById('btnCetak').disabled = false;
    }

    // ==========================================
    // 3. FETCH DATA DARI GAS (JSONP Bypass CORS)
    // ==========================================
    if (START_DATE && END_DATE) {
      window.handleLaporanData = function(res) {
        if (!res || !res.success) {
          document.getElementById('output').innerHTML = 
            '<div class="alert alert-danger text-center">Gagal memuat laporan: ' + (res ? (res.message || 'Server error.') : 'Respons kosong.') + '</div>';
          return;
        }
        renderLaporan(res.data, res.catatan);
      };

      const apiUrl = `${GAS_WEBAPP_URL}?api=laporan&start=${START_DATE}&end=${END_DATE}&halaqoh=${HALAQOH_ID}&nis=${NIS_PARAM}&callback=handleLaporanData`;
      const script = document.createElement('script');
      script.src = apiUrl;
      script.onerror = function() {
        document.getElementById('output').innerHTML = 
          '<div class="alert alert-danger text-center">Terjadi kesalahan saat menghubungi server (CORS / Network Error).</div>';
      };
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
